name: Publish to npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish (e.g., 0.5.2)'
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install dependencies
              run: bun install

            - name: Sync version from version.json
              run: bun run sync-version

            - name: Validate manual release version
              if: github.event_name == 'workflow_dispatch'
              run: |
                  VERSION=$(cat version.json | grep '"version"' | cut -d'"' -f4)
                  if [ "$VERSION" != "${{ inputs.version }}" ]; then
                      echo "Expected version ${{ inputs.version }}, but checked out $VERSION"
                      exit 1
                  fi

            - name: Determine version
              id: version
              run: |
                  VERSION=$(cat version.json | grep '"version"' | cut -d'"' -f4)
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT

            - name: Build binaries with web assets
              run: bun run build:single-exe:all

            - name: Prepare npm packages
              run: bun run prepare-npm-packages
              working-directory: cli

            - name: Publish platform packages
              run: |
                  for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
                      echo "Publishing @flintttan/hapi-${platform}..."
                      cd npm/${platform}
                      npm publish --access public
                      cd ../..
                  done
              working-directory: cli

            - name: Publish main package
              run: |
                  cd npm/main
                  npm publish --access public
              working-directory: cli
